<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img"
     aria-label="A gauge next to a checklist of proxy tests with pass marks">
  <defs>
    <linearGradient id="tArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/><stop offset=".6" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".04"/>
    </linearGradient>
    <filter id="tSoft" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1220" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="none"/>
  <circle cx="300" cy="70" r="240" fill="url(#tBlob)"/>

  <g filter="url(#tSoft)">
    <rect x="120" y="52" width="420" height="216" rx="24" fill="#fff" stroke="#e3e8ef"/>
    <path d="M190 216a140 140 0 0 1 280 0" fill="none" stroke="#eef2f7" stroke-width="26"
          stroke-linecap="round"/>
    <path d="M190 216a140 140 0 0 1 205-119" fill="none" stroke="url(#tArc)" stroke-width="26"
          stroke-linecap="round"/>
    <circle cx="330" cy="216" r="16" fill="#0b1220"/>
    <path d="M330 216l72-66" stroke="#0b1220" stroke-width="8" stroke-linecap="round"/>
    <text x="330" y="112" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="40"
          font-weight="700" fill="#0b1220" text-anchor="middle">98%</text>
    <text x="330" y="256" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="20"
          fill="#5b6675" text-anchor="middle">success rate, not latency</text>
  </g>

  <g filter="url(#tSoft)">
    <rect x="620" y="52" width="460" height="216" rx="24" fill="#fff" stroke="#e3e8ef"/>
    <g>
      <circle cx="668" cy="104" r="15" fill="#0f7b46"/>
      <path d="M661 104l6 6 12-13" fill="none" stroke="#fff" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="698" y="96" width="200" height="13" rx="6" fill="#c9d5e6"/>
    </g>
    <g>
      <circle cx="668" cy="152" r="15" fill="#0f7b46"/>
      <path d="M661 152l6 6 12-13" fill="none" stroke="#fff" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="698" y="144" width="160" height="13" rx="6" fill="#c9d5e6"/>
    </g>
    <g>
      <circle cx="668" cy="200" r="15" fill="#e6ecf5"/>
      <path d="M662 194l12 12M674 194l-12 12" fill="none" stroke="#93a2b8" stroke-width="3.4"
            stroke-linecap="round"/>
      <rect x="698" y="192" width="228" height="13" rx="6" fill="#e2e9f3"/>
    </g>
    <g>
      <circle cx="668" cy="240" r="15" fill="#0f7b46"/>
      <path d="M661 240l6 6 12-13" fill="none" stroke="#fff" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="698" y="232" width="140" height="13" rx="6" fill="#c9d5e6"/>
    </g>
  </g>
</svg>
