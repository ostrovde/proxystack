<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img"
     aria-label="Two options compared: a datacenter rack and a home connection, with a decision pointer">
  <defs>
    <linearGradient id="pBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="pTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="pBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".04"/>
    </linearGradient>
    <filter id="pSoft" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1220" flood-opacity=".15"/>
    </filter>
    <pattern id="pDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#0f766e" opacity=".2"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="none"/>
  <circle cx="600" cy="60" r="250" fill="url(#pBlob)"/>
  <rect x="60" y="190" width="180" height="100" fill="url(#pDots)" opacity=".7"/>

  <!-- датацентр -->
  <g filter="url(#pSoft)">
    <rect x="150" y="60" width="380" height="200" rx="22" fill="#fff" stroke="#e3e8ef"/>
    <rect x="186" y="96" width="120" height="128" rx="12" fill="#eef4ff" stroke="#dbe6f7"/>
    <rect x="204" y="116" width="84" height="14" rx="5" fill="url(#pBlue)"/>
    <rect x="204" y="142" width="84" height="14" rx="5" fill="url(#pBlue)" opacity=".8"/>
    <rect x="204" y="168" width="84" height="14" rx="5" fill="url(#pBlue)" opacity=".6"/>
    <rect x="204" y="194" width="84" height="14" rx="5" fill="url(#pBlue)" opacity=".4"/>
    <text x="336" y="122" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="19"
          font-weight="700" fill="#0b1220">Datacenter</text>
    <rect x="336" y="140" width="150" height="11" rx="5" fill="#c9d5e6"/>
    <rect x="336" y="162" width="118" height="11" rx="5" fill="#e2e9f3"/>
    <rect x="336" y="184" width="138" height="11" rx="5" fill="#e2e9f3"/>
    <text x="336" y="226" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="16"
          fill="#5b6675">per IP · fast · cheap</text>
  </g>

  <!-- дом -->
  <g filter="url(#pSoft)">
    <rect x="670" y="60" width="380" height="200" rx="22" fill="#fff" stroke="#e3e8ef"/>
    <path d="M712 158l58-46 58 46v66a8 8 0 0 1-8 8h-100a8 8 0 0 1-8-8z"
          fill="#effcf9" stroke="#0f766e" stroke-width="3"/>
    <path d="M700 162l70-56 70 56" fill="none" stroke="url(#pTeal)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="856" y="122" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="19"
          font-weight="700" fill="#0b1220">Residential</text>
    <rect x="856" y="140" width="150" height="11" rx="5" fill="#c9d5e6"/>
    <rect x="856" y="162" width="122" height="11" rx="5" fill="#e2e9f3"/>
    <rect x="856" y="184" width="96" height="11" rx="5" fill="#e2e9f3"/>
    <text x="856" y="226" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="16"
          fill="#5b6675">per GB · slower · trusted</text>
  </g>
</svg>
