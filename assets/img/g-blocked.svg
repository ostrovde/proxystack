<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img"
     aria-label="A blocked request showing a 403 response, with a stop sign and a rate chart">
  <defs>
    <linearGradient id="bRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b91c1c"/><stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="bAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b91c1c" stop-opacity=".04"/>
    </linearGradient>
    <filter id="bSoft" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1220" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="none"/>
  <circle cx="880" cy="80" r="240" fill="url(#bBlob)"/>

  <g filter="url(#bSoft)">
    <rect x="120" y="66" width="480" height="188" rx="24" fill="#fff" stroke="#e3e8ef"/>
    <rect x="156" y="102" width="120" height="34" rx="10" fill="#eef2f7"/>
    <text x="172" y="127" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="21"
          font-weight="700" fill="#5b6675">GET</text>
    <rect x="292" y="102" width="272" height="34" rx="10" fill="#eef2f7"/>
    <rect x="156" y="156" width="408" height="14" rx="7" fill="#c9d5e6"/>
    <rect x="156" y="186" width="300" height="14" rx="7" fill="#e2e9f3"/>
    <rect x="156" y="216" width="348" height="14" rx="7" fill="#e2e9f3"/>
    <g>
      <rect x="428" y="146" width="120" height="52" rx="14" fill="url(#bRed)"/>
      <text x="488" y="181" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26"
            font-weight="700" fill="#fff" text-anchor="middle">403</text>
    </g>
  </g>

  <g filter="url(#bSoft)">
    <rect x="660" y="66" width="420" height="188" rx="24" fill="#fff" stroke="#e3e8ef"/>
    <path d="M712 216h60v-38h-60zM792 216h60v-72h-60zM872 216h60v-104h-60z" fill="#eef2f7"/>
    <path d="M792 216h60v-72h-60z" fill="url(#bAmber)" opacity=".55"/>
    <path d="M872 216h60v-104h-60z" fill="url(#bRed)" opacity=".75"/>
    <text x="712" y="106" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="20"
          fill="#5b6675">requests per minute</text>
    <path d="M712 130h220" stroke="#e3e8ef" stroke-width="3"/>
  </g>

  <g filter="url(#bSoft)" transform="translate(1032 168)">
    <path d="M0-56l50 14v42c0 34-22 54-50 64-28-10-50-30-50-64v-42z" fill="url(#bRed)"/>
    <rect x="-30" y="-16" width="60" height="12" rx="6" fill="#fff"/>
  </g>
</svg>
