<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"
     aria-label="Illustration: a wireframe globe with proxy nodes, a shield check and request-rate chips">
  <defs>
    <linearGradient id="hBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".20"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="hGlobe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="hGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7b46"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="hSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1220" flood-opacity=".16"/>
    </filter>
    <pattern id="hDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#0f766e" opacity=".22"/>
    </pattern>
  </defs>

  <rect width="1120" height="620" fill="none"/>
  <circle cx="720" cy="310" r="300" fill="url(#hBlob)"/>
  <rect x="40" y="44" width="220" height="140" fill="url(#hDots)" opacity=".8"/>

  <!-- глобус -->
  <g filter="url(#hSoft)">
    <circle cx="720" cy="300" r="168" fill="url(#hGlobe)"/>
    <g fill="none" stroke="#5eead4" stroke-width="2" opacity=".55">
      <circle cx="720" cy="300" r="168"/>
      <ellipse cx="720" cy="300" rx="66" ry="168"/>
      <ellipse cx="720" cy="300" rx="126" ry="168"/>
      <path d="M552 300h336M578 216h284M578 384h284"/>
    </g>
    <!-- узлы -->
    <g fill="#f59e0b">
      <circle cx="628" cy="232" r="9"/><circle cx="806" cy="266" r="9"/>
      <circle cx="676" cy="382" r="9"/><circle cx="742" cy="176" r="9"/>
    </g>
    <g fill="none" stroke="#facc15" stroke-width="2.4" opacity=".85">
      <path d="M628 232q90-40 178 34"/>
      <path d="M806 266q-60 90-130 116"/>
      <path d="M628 232q60 100 48 150"/>
    </g>
  </g>

  <!-- чипы метрик -->
  <g filter="url(#hSoft)">
    <g>
      <rect x="86" y="236" width="264" height="88" rx="18" fill="#fff" stroke="#e3e8ef"/>
      <text x="112" y="268" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26"
            fill="#5b6675" letter-spacing="1.2">REQ / SEC</text>
      <text x="112" y="304" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="52"
            font-weight="700" fill="#0b1220">1 480</text>
      <rect x="244" y="288" width="86" height="10" rx="5" fill="#eef2f9"/>
      <rect x="244" y="288" width="66" height="10" rx="5" fill="#14b8a6"/>
    </g>
    <g>
      <rect x="140" y="356" width="264" height="88" rx="18" fill="#fff" stroke="#e3e8ef"/>
      <text x="166" y="388" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26"
            fill="#5b6675" letter-spacing="1.2">SUCCESS RATE</text>
      <text x="166" y="424" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="52"
            font-weight="700" fill="#0f7b46">98.2%</text>
      <rect x="298" y="408" width="86" height="10" rx="5" fill="#eef2f9"/>
      <rect x="298" y="408" width="80" height="10" rx="5" fill="#22c55e"/>
    </g>
    <g>
      <rect x="196" y="474" width="240" height="76" rx="18" fill="#fff" stroke="#e3e8ef"/>
      <text x="222" y="506" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26"
            fill="#5b6675" letter-spacing="1.2">BLOCKED</text>
      <text x="222" y="536" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="44"
            font-weight="700" fill="#8a5a00">1.8%</text>
    </g>
  </g>

  <!-- щит -->
  <g filter="url(#hSoft)" transform="translate(892 452)">
    <path d="M0-52l62 28v46c0 36-25 60-62 70-37-10-62-34-62-70v-46z" fill="url(#hGreen)"/>
    <path d="M-27 20l20 20 38-44" fill="none" stroke="#fff" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
